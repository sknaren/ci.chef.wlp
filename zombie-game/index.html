<script>
/* ===== DEAD CITY RIDER 3D  -  up to 4 players, split-screen co-op =====
   LOBBY : W/A/S/D or click = join as Keyboard+Mouse | arrow keys = join as Keyboard 2 | gamepad A = join | ENTER = start
   You start in your own house. Search furniture for a gun, find your bike parked out front.
   Days are 2 min, nights are 4 min. Zombies only come at night and are drawn to NOISE
   (gunshots, the bike engine, doors, searching, fighting). The game ends only when every player is dead.

   Keyboard+Mouse : WASD move/ride, mouse aim, LEFT CLICK / Space = shoot (or punch with your fist),
                    E use (doors, search, take, bike), Q switch gun, G drop gun, F medkit, 1-5 bag slot
   Keyboard 2     : arrows move, Enter = shoot/punch (auto-aim), RightShift use, . switch, , drop, / medkit
   Gamepad        : left stick move, right stick aim, RT/RB shoot/punch, A use, Y switch, B drop, X medkit */

// ---------- renderer / overlay ----------
const R = new THREE.WebGLRenderer({antialias:true});
document.body.insertBefore(R.domElement, document.getElementById('ui'));
const ui = document.getElementById('ui'), ctx = ui.getContext('2d');
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0e16);
scene.fog = new THREE.Fog(0x0b0e16, 500, 1500);
const mainCam = new THREE.PerspectiveCamera(55, 1, 1, 4000);
let W, H, VW, VH;
function resize(){
  W = ui.width = innerWidth; H = ui.height = innerHeight;
  R.setSize(W,H); R.setPixelRatio(Math.min(devicePixelRatio,2)); mainCam.aspect = W/H; mainCam.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

// ---------- helpers ----------
const rand = (a,b)=>a+Math.random()*(b-a);
const randInt = (a,b)=>Math.floor(rand(a,b+1));
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const dist = (a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const TAU = Math.PI*2;
const normAng = a=>Math.atan2(Math.sin(a),Math.cos(a));
const pick = arr=>arr[Math.floor(Math.random()*arr.length)];
const fmtTime = s=>{ s=Math.max(0,Math.ceil(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); };

// ---------- input ----------
const keyDown = {}, keyHit = {}; const mouse = {x:0,y:0,down:false};
addEventListener('keydown',e=>{
  if(e.repeat) return;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Slash','Tab'].includes(e.code)) e.preventDefault();
  keyDown[e.code]=true; keyHit[e.code]=true; audioInit(); onGlobalKey(e.code);
});
addEventListener('keyup',e=>keyDown[e.code]=false);
addEventListener('mousemove',e=>{ mouse.x=e.clientX; mouse.y=e.clientY; });
addEventListener('mousedown',()=>{ mouse.down=true; audioInit(); if(state==='lobby') lobbyClick(); });
addEventListener('mouseup',()=>mouse.down=false);
addEventListener('contextmenu',e=>e.preventDefault());

const KEYMAPS = {
  kbm:{up:['KeyW'],dn:['KeyS'],lf:['KeyA'],rt:['KeyD'],fire:['Space'],use:'KeyE',sw:'KeyQ',drop:'KeyG',med:'KeyF'},
  kb2:{up:['ArrowUp'],dn:['ArrowDown'],lf:['ArrowLeft'],rt:['ArrowRight'],fire:['Enter'],use:'ShiftRight',sw:'Period',drop:'Comma',med:'Slash'},
};
function readCtl(P){
  const inp = P.input, c = {mx:0,my:0,up:false,dn:false,lf:false,rt:false,fire:false,aim:null,use:false,sw:false,drop:false,med:false,slot:-1};
  if(inp.kind==='pad'){
    const gp = (navigator.getGamepads&&navigator.getGamepads()[inp.pad]); if(!gp) return c;
    const b = i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);
    let ax=gp.axes[0]||0, ay=gp.axes[1]||0; if(Math.hypot(ax,ay)<.25) ax=ay=0;
    if(b(14)) ax=-1; if(b(15)) ax=1; if(b(12)) ay=-1; if(b(13)) ay=1;
    c.mx=ax; c.my=ay; c.up=ay<-.3; c.dn=ay>.3; c.lf=ax<-.3; c.rt=ax>.3;
    c.fire = b(7)||b(5);
    const rx=gp.axes[2]||0, ry=gp.axes[3]||0; if(Math.hypot(rx,ry)>.35) c.aim=Math.atan2(ry,rx);
    const prev = inp.prev||[], hit = i=>b(i)&&!prev[i];
    c.use=hit(0); c.drop=hit(1); c.med=hit(2); c.sw=hit(3);
    inp.prev = Array.from(gp.buttons,x=>x.pressed);
  } else {
    const m = KEYMAPS[inp.kind], any = a=>a.some(k=>keyDown[k]);
    const arrowsFree = inp.kind==='kbm' && !players.some(p=>p.input.kind==='kb2');
    c.up = any(m.up)||(arrowsFree&&keyDown.ArrowUp); c.dn = any(m.dn)||(arrowsFree&&keyDown.ArrowDown);
    c.lf = any(m.lf)||(arrowsFree&&keyDown.ArrowLeft); c.rt = any(m.rt)||(arrowsFree&&keyDown.ArrowRight);
    c.mx = (c.rt?1:0)-(c.lf?1:0); c.my = (c.dn?1:0)-(c.up?1:0);
    c.fire = any(m.fire) || (inp.kind==='kbm'&&mouse.down);
    c.use=!!keyHit[m.use]; c.sw=!!keyHit[m.sw]; c.drop=!!keyHit[m.drop]; c.med=!!keyHit[m.med];
    if(inp.kind==='kbm') for(let i=0;i<5;i++) if(keyHit['Digit'+(i+1)]) c.slot=i;
  }
  return c;
}

// =====================================================================
//  AUDIO ENGINE  (everything is synthesised with WebAudio - no files)
// =====================================================================
let AC, master, noiseBuf, engine, ambient, drone;
function audioInit(){
  if(AC){ if(AC.state==='suspended') AC.resume(); return; }
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.85;
    const comp = AC.createDynamicsCompressor(); master.connect(comp); comp.connect(AC.destination);
    noiseBuf = AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    startAmbient(); startEngine(); if(state==='cutscene') startDrone();
  }catch(e){ AC=null; }
}
function noise(o){
  if(!AC) return;
  const t = AC.currentTime+(o.delay||0), dur=o.dur||.2;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type=o.type||'lowpass'; f.Q.value=o.q||1;
  f.frequency.setValueAtTime(o.f||1000,t); if(o.f2) f.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(o.vol||.3,t+(o.attack||.003)); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t,Math.random()); s.stop(t+dur+.05);
}
function tone(o){
  if(!AC) return;
  const t = AC.currentTime+(o.delay||0), dur=o.dur||.2;
  const os = AC.createOscillator(); os.type=o.type||'sine';
  os.frequency.setValueAtTime(o.f||200,t); if(o.f2) os.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
  let out = os;
  if(o.vib){ const l=AC.createOscillator(), lg=AC.createGain(); l.frequency.value=o.vibRate||6; lg.gain.value=o.vib; l.connect(lg); lg.connect(os.frequency); l.start(t); l.stop(t+dur+.05); }
  if(o.filter){ const f=AC.createBiquadFilter(); f.type=o.filter.type||'lowpass'; f.Q.value=o.filter.q||1;
    f.frequency.setValueAtTime(o.filter.f,t); if(o.filter.f2) f.frequency.exponentialRampToValueAtTime(o.filter.f2,t+dur); os.connect(f); out=f; }
  const g = AC.createGain(); g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(o.vol||.2,t+(o.attack||.005)); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  out.connect(g); g.connect(master); os.start(t); os.stop(t+dur+.05);
}
// how loud something is for the nearest living player
const falloff = (x,y)=>{ let d=1e9; for(const p of players) if(p.alive) d=Math.min(d,Math.hypot(p.x-x,p.y-y)); return clamp(1-d/750,0,1); };

const sfx = {
  shot(id){
    if(id==='pistol'){ noise({type:'highpass',f:1400,dur:.12,vol:.5}); noise({f:1000,f2:200,dur:.28,vol:.5}); tone({f:170,f2:50,dur:.16,vol:.45}); }
    if(id==='smg'){ noise({type:'highpass',f:1800,dur:.07,vol:.38}); noise({f:1400,f2:300,dur:.12,vol:.3}); tone({f:200,f2:70,dur:.08,vol:.3,type:'triangle'}); }
    if(id==='shotgun'){ noise({f:2000,f2:120,dur:.55,vol:.85}); noise({type:'highpass',f:1200,dur:.16,vol:.45}); tone({f:95,f2:32,dur:.45,vol:.7});
      noise({type:'bandpass',f:2400,q:8,dur:.04,vol:.3,delay:.5}); noise({type:'bandpass',f:1800,q:8,dur:.05,vol:.3,delay:.62}); }
    if(id==='rifle'){ noise({type:'highpass',f:2500,dur:.1,vol:.6}); noise({f:2200,f2:260,dur:.7,vol:.5}); tone({f:230,f2:55,dur:.22,vol:.5}); }
  },
  empty(){ noise({type:'bandpass',f:3000,q:6,dur:.04,vol:.25}); tone({f:900,f2:600,dur:.04,vol:.06,type:'square'}); },
  switchGun(){ noise({type:'bandpass',f:2200,q:5,dur:.05,vol:.25}); noise({type:'bandpass',f:1500,q:5,dur:.06,vol:.25,delay:.09}); },
  whoosh(){ noise({type:'bandpass',f:500,f2:1800,q:1.5,dur:.16,vol:.22}); },
  punch(v=1){ noise({f:700,f2:150,dur:.12,vol:.5*v}); tone({f:110,f2:50,dur:.14,vol:.5*v,type:'triangle'}); },
  hit(v=1){ noise({f:600,f2:150,dur:.14,vol:.35*v}); tone({f:130,f2:55,dur:.12,vol:.3*v}); },
  ram(){ noise({f:900,f2:120,dur:.25,vol:.6}); tone({f:90,f2:35,dur:.25,vol:.6,type:'triangle'}); noise({type:'bandpass',f:2500,q:3,dur:.08,vol:.25}); },
  bump(){ noise({f:500,f2:80,dur:.3,vol:.5}); tone({f:70,f2:30,dur:.25,vol:.5}); },
  bite(){ noise({type:'bandpass',f:700,f2:300,q:3,dur:.22,vol:.5}); tone({f:110,f2:60,dur:.2,vol:.2,type:'sawtooth',filter:{f:400}}); },
  hurt(){ tone({f:260,f2:140,dur:.25,vol:.18,type:'sawtooth',filter:{f:900}}); },
  groan(v=1,pitch=1){
    const f=rand(85,120)*pitch;
    tone({f,f2:f*0.62,dur:rand(.9,1.4),type:'sawtooth',vol:.22*v,attack:.15,vib:4,vibRate:rand(4,7),filter:{type:'bandpass',f:420,f2:rand(700,950),q:4}});
    tone({f:f*1.5,f2:f*0.9,dur:1,type:'sawtooth',vol:.08*v,attack:.2,filter:{type:'bandpass',f:900,f2:600,q:5}});
  },
  zdie(v=1){ tone({f:130,f2:45,dur:.8,type:'sawtooth',vol:.25*v,attack:.03,vib:5,filter:{type:'bandpass',f:600,f2:250,q:3}});
    tone({f:70,f2:30,dur:.3,vol:.4*v,delay:.25}); noise({f:300,f2:80,dur:.25,vol:.3*v,delay:.25}); },
  sizzle(v=1){ noise({type:'highpass',f:3000,dur:.6,vol:.12*v}); },
  step(v=1){ noise({type:'bandpass',f:rand(250,400),q:1.2,dur:.07,vol:.18*v}); },
  doorOpen(){ tone({f:190,f2:120,dur:.75,type:'sawtooth',vol:.12,attack:.08,vib:12,vibRate:9,filter:{type:'bandpass',f:500,f2:900,q:9}}); noise({f:300,dur:.08,vol:.15}); },
  doorClose(){ tone({f:140,f2:200,dur:.5,type:'sawtooth',vol:.08,attack:.05,filter:{type:'bandpass',f:700,f2:400,q:9}});
               noise({f:260,f2:60,dur:.2,vol:.55,delay:.38}); tone({f:80,f2:35,dur:.2,vol:.4,delay:.38}); },
  scrape(){ noise({type:'bandpass',f:500,f2:1400,q:2,dur:.45,vol:.25}); },
  rummage(){ noise({type:'bandpass',f:rand(1500,4000),q:2,dur:rand(.05,.1),vol:.14}); if(Math.random()<.4) tone({f:rand(700,1400),f2:rand(500,900),dur:.05,type:'triangle',vol:.05}); },
  clunk(){ tone({f:160,f2:70,dur:.15,vol:.25}); noise({f:900,f2:200,dur:.1,vol:.2}); },
  found(){ [880,1175,1568].forEach((f,i)=>tone({f,dur:.16,type:'triangle',vol:.1,delay:i*.07})); },
  pickup(){ tone({f:660,f2:990,dur:.12,type:'sine',vol:.15}); },
  coin(){ tone({f:1318,dur:.1,type:'square',vol:.06}); tone({f:1760,dur:.22,type:'square',vol:.06,delay:.08}); },
  med(){ [523,659,784].forEach((f,i)=>tone({f,dur:.25,type:'sine',vol:.12,delay:i*.1})); },
  ammo(){ noise({type:'bandpass',f:2500,q:6,dur:.04,vol:.25}); noise({type:'bandpass',f:3200,q:6,dur:.04,vol:.2,delay:.07}); tone({f:520,f2:700,dur:.1,type:'triangle',vol:.08}); },
  deny(){ tone({f:200,f2:120,dur:.18,type:'square',vol:.07}); },
  mount(){ tone({f:50,f2:130,dur:.5,type:'sawtooth',vol:.15,filter:{f:300,f2:900}}); noise({f:400,f2:1200,dur:.4,vol:.15}); },
  dismount(){ tone({f:130,f2:45,dur:.5,type:'sawtooth',vol:.12,filter:{f:600,f2:150}}); },
  heartbeat(){ tone({f:60,f2:40,dur:.14,vol:.5}); tone({f:55,f2:38,dur:.16,vol:.4,delay:.2}); },
  scream(){ for(const [f,d] of [[620,0],[780,.05]]) tone({f,f2:f*1.5,dur:1.6,type:'sawtooth',vol:.18,attack:.05,delay:d,vib:25,vibRate:8,filter:{type:'bandpass',f:1500,f2:2400,q:3}}); },
  gasp(){ noise({type:'bandpass',f:1200,f2:2400,q:2,dur:.35,vol:.25}); },
  squelch(){ noise({type:'bandpass',f:rand(300,900),f2:rand(150,400),q:4,dur:rand(.12,.25),vol:.3}); if(Math.random()<.5) tone({f:rand(80,140),f2:50,dur:.15,type:'sawtooth',vol:.08,filter:{f:300}}); },
  death(){ tone({f:110,f2:28,dur:2.2,type:'sawtooth',vol:.25,filter:{f:600,f2:80}}); noise({f:800,f2:60,dur:1.5,vol:.3}); },
  nightHorn(){ tone({f:80,f2:62,dur:3.2,type:'sawtooth',vol:.3,attack:.6,filter:{f:500,f2:200}}); tone({f:120,f2:92,dur:3.2,type:'square',vol:.1,attack:.8,filter:{f:400}}); },
  dawn(){ [523,659,784,1046].forEach((f,i)=>tone({f,dur:1.4,type:'sine',vol:.14,delay:i*.28})); },
};

function startEngine(){
  const o1=AC.createOscillator(), o2=AC.createOscillator(), f=AC.createBiquadFilter(), g=AC.createGain();
  o1.type='sawtooth'; o2.type='square'; f.type='lowpass'; f.frequency.value=500; f.Q.value=3; g.gain.value=0;
  o1.connect(f); o2.connect(f); f.connect(g); g.connect(master); o1.start(); o2.start();
  engine = {o1,o2,f,g};
}
function startAmbient(){
  const s=AC.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
  const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=380; f.Q.value=0.8;
  const g=AC.createGain(); g.gain.value=0.045;
  const lfo=AC.createOscillator(), lg=AC.createGain(); lfo.frequency.value=0.13; lg.gain.value=0.03; lfo.connect(lg); lg.connect(g.gain);
  const lfo2=AC.createOscillator(), lg2=AC.createGain(); lfo2.frequency.value=0.07; lg2.gain.value=160; lfo2.connect(lg2); lg2.connect(f.frequency);
  s.connect(f); f.connect(g); g.connect(master); s.start(); lfo.start(); lfo2.start();
  ambient = {g};
}
function startDrone(){
  const o1=AC.createOscillator(), o2=AC.createOscillator(), g=AC.createGain(), f=AC.createBiquadFilter();
  o1.type='sawtooth'; o2.type='sawtooth'; o1.frequency.value=55; o2.frequency.value=58.5; f.type='lowpass'; f.frequency.value=220;
  g.gain.setValueAtTime(0.0001,AC.currentTime); g.gain.linearRampToValueAtTime(0.07,AC.currentTime+3);
  o1.connect(f); o2.connect(f); f.connect(g); g.connect(master); o1.start(); o2.start();
  drone = {o1,o2,g};
}
function stopDrone(){
  if(!drone||!AC) return; const d=drone; drone=null;
  d.g.gain.cancelScheduledValues(AC.currentTime); d.g.gain.setTargetAtTime(0.0001,AC.currentTime,0.3);
  setTimeout(()=>{ try{d.o1.stop();d.o2.stop();}catch(e){} },1500);
}
let hbT=0;
function audioTick(dt){
  if(!AC||!engine) return;
  const t = AC.currentTime;
  let v=0, thr=false;
  if(state==='play') for(const p of players) if(p.alive&&p.mounted){ v=Math.max(v,Math.abs(p.v)); thr = thr||p.thr; }
  const on = v>0 || (state==='play'&&players.some(p=>p.alive&&p.mounted));
  const f = 34 + v*0.30 + (thr?9:0);
  engine.o1.frequency.setTargetAtTime(f,t,0.08); engine.o2.frequency.setTargetAtTime(f*0.5,t,0.08);
  engine.f.frequency.setTargetAtTime(350+v*3.5+(thr?250:0),t,0.1);
  engine.g.gain.setTargetAtTime(on?0.055+v/330*0.05+(thr?0.02:0):0,t,0.12);
  if(ambient) ambient.g.gain.setTargetAtTime(state==='play'? 0.03+(1-dayNow)*0.05 : 0.045,t,1);
  if(state==='play' && players.some(p=>p.alive&&p.hp<35)){ hbT-=dt; if(hbT<=0){ hbT=0.85; sfx.heartbeat(); } }
}

// ---------- lights ----------
const hemi = new THREE.HemisphereLight(0x8899cc, 0x222233, 0.75); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xaabbff, 0.55); sun.position.set(-300,600,200); scene.add(sun);
const cutLight = new THREE.PointLight(0xffe9b0, 1.3, 450, 1.5); scene.add(cutLight);
const C_NIGHT = {bg:new THREE.Color(0x0b0e16), hs:new THREE.Color(0x8899cc), hg:new THREE.Color(0x222233), sun:new THREE.Color(0xaabbff)};
const C_DAY   = {bg:new THREE.Color(0x87b5dc), hs:new THREE.Color(0xdbeaff), hg:new THREE.Color(0x667755), sun:new THREE.Color(0xfff0cf)};
let dayNow = 0;
function applyLighting(d){
  dayNow = d;
  scene.background.lerpColors(C_NIGHT.bg,C_DAY.bg,d); scene.fog.color.copy(scene.background);
  scene.fog.near = 500+300*d; scene.fog.far = 1500+1300*d;
  hemi.color.lerpColors(C_NIGHT.hs,C_DAY.hs,d); hemi.groundColor.lerpColors(C_NIGHT.hg,C_DAY.hg,d); hemi.intensity = 0.75+0.5*d;
  sun.color.lerpColors(C_NIGHT.sun,C_DAY.sun,d); sun.intensity = 0.55+0.45*d;
  sun.position.set(-300+600*d,600+200*d,200);
  for(const p of players) if(p.light) p.light.intensity = 0.15+1.15*(1-d);
}

// ---------- 3D characters ----------
function makeHuman(o){
  const root = new THREE.Group(), body = new THREE.Group(); root.add(body);
  const legs = [], arms = [];
  for(const s of [-1,1]){
    const leg = new THREE.Group(); leg.position.set(0,14,s*3.5);
    leg.add(box(4.5,14,4.5,o.pants,0,-7,0)); body.add(leg); legs.push(leg);
  }
  const upper = new THREE.Group(); upper.position.y = 14; body.add(upper);
  upper.add(box(7,16,13,o.shirt,0,8,0));
  const head = box(9,9,9,o.skin,0,20.5,0); upper.add(head);

  else if(o.helmet) upper.add(box(10,5,10,o.helmet,0,24,0));

function attachGear(h){

const ROAD = 160, BLOCK = 600, GRID = 4;
const WORLD = BLOCK*GRID;
const LO = -ROAD/2, HI = WORLD+ROAD/2;
const walls = [], houses = [], doors = [], furniture = [];
const WALL_H = 58, DOOR_H = 50, WT = 12, DOOR_W = 64, HW = 180, HH = 150;
const SPAWN_IDX = [0, 12, 48, 60];            // top-left house of the four corner blocks: 4 separate starting places

function addWall(x,y,w,h,color,extra){ if(w<=0||h<=0) return null; const o=Object.assign({x,y,w,h,color},extra); walls.push(o); return o; }

const FURN = {
  cupboard:{dp:16,wd:34,ht:40,search:true,name:'cupboard'},
  wardrobe:{dp:20,wd:40,ht:62,search:true,name:'wardrobe'},
  fridge  :{dp:22,wd:26,ht:54,search:true,name:'fridge'},
  dresser :{dp:18,wd:38,ht:28,search:true,name:'drawers'},
  bed     :{dp:38,wd:70,ht:14,search:false},
  sofa    :{dp:24,wd:56,ht:24,search:false},
  table   :{dp:30,wd:40,ht:22,search:false},
};
function addFurn(h,kind,slot){
  const d = FURN[kind], r = h.r;
  let x,y,face;
  const vy = v => r===0 ? h.y+v : h.y+h.h-v;
  if(slot==='backL'||slot==='backR'){
    x = slot==='backL' ? h.x+34 : h.x+h.w-34; y = vy(WT+d.dp/2); face = r===0 ? Math.PI/2 : -Math.PI/2;
  } else if(slot==='left'){ x = h.x+WT+d.dp/2; y = vy(h.h*0.5); face = 0; }
  else { x = h.x+h.w-WT-d.dp/2; y = vy(h.h*0.5); face = Math.PI; }
  const horiz = Math.abs(Math.cos(face))>0.5, ex = horiz?d.dp:d.wd, ey = horiz?d.wd:d.dp;
  addWall(x-ex/2,y-ey/2,ex,ey,null,{noMesh:true});
  const f = {kind,x,y,face,dp:d.dp,wd:d.wd,ht:d.ht,search:d.search,name:d.name,state:'closed',anim:0,item:null,house:h,busy:null};
  h.furn.push(f); furniture.push(f);
}
function buildCityData(){
  const palette = [0x7a4b3a,0x566b7a,0x6b6a4a,0x7a5a6b,0x4f6b55];
  const searchables = ['cupboard','wardrobe','fridge','dresser'];
  for(let bi=0; bi<GRID; bi++) for(let bj=0; bj<GRID; bj++){
    const bx = bi*BLOCK+ROAD/2, by = bj*BLOCK+ROAD/2;
    for(let r=0;r<2;r++) for(let c=0;c<2;c++){
      const hx = bx+20+c*(HW+40), hy = by+20+r*(HH+100);
      const color = palette[(bi*3+bj*5+r*2+c)%5];
      const h = {x:hx,y:hy,w:HW,h:HH,color,r,furn:[],door:null,idx:houses.length};
      houses.push(h);
      addWall(hx,hy,WT,HH,color); addWall(hx+HW-WT,hy,WT,HH,color);
      const dx = hx+HW/2-DOOR_W/2;
      const backY = r===0 ? hy : hy+HH-WT, frontY = r===0 ? hy+HH-WT : hy;
      addWall(hx,backY,HW,WT,color);
      addWall(hx,frontY,dx-hx,WT,color); addWall(dx+DOOR_W,frontY,hx+HW-(dx+DOOR_W),WT,color);
      const dw = addWall(dx,frontY,DOOR_W,WT,null,{noMesh:true,door:true});
      h.door = {house:h,x:dx,y:frontY,cx:dx+DOOR_W/2,cy:frontY+WT/2,wall:dw,open:false,ang:0,sign:r===0?1:-1};
      doors.push(h.door);
      const pool = searchables.slice().sort(()=>Math.random()-.5);
      addFurn(h,pool[0],'backL'); addFurn(h,pool[1],'backR');
      if(Math.random()<.5) addFurn(h,pool[2],'left'); else addFurn(h,'sofa','left');
      addFurn(h,pick(['bed','bed','sofa','table']),'right');
    }
  }
}
function rollItem(){
  const r = Math.random();
  if(r<.28) return null;
  if(r<.50) return {type:'ammo',n:randInt(10,25)};
  if(r<.64) return {type:'cash',n:pick([25,50,75,100])};
  if(r<.77) return {type:'med'};
  const g = Math.random();
  return {type:'gun',id: g<.35?'pistol':g<.65?'smg':g<.85?'shotgun':'rifle'};
}

// ---------- furniture meshes ----------
const woodMats = [M(0x6b4a2b),M(0x5a3d25),M(0x7a5a38),M(0x4d3a2a)];
function buildFurnMesh(f){
  const g = new THREE.Group(), wood = woodMats[Math.floor((f.x+f.y)/7)%4], dp=f.dp, wd=f.wd, ht=f.ht;
  const k = f.kind; g.userData = {};
  if(k==='cupboard'||k==='wardrobe'||k==='fridge'){
    const bodyM = k==='fridge'?M(0xdfe6ea):wood;
    g.add(box(dp,ht,wd,bodyM,0,ht/2,0));
    g.add(box(0.5,ht-5,wd-5,mat.dark,dp/2+0.2,ht/2,0));
    if(k==='cupboard') g.add(box(dp+2,2,wd+2,M(0x9a9a9a),0,ht+1,0));
    const leafM = k==='fridge'?M(0xf2f6f8):M(wood.color.getHex()+0x101010);
    const pivots = [];
    const mk = (z,wLeaf,sgn)=>{
      const p = new THREE.Group(); p.position.set(dp/2+0.9,0,z);
      const leaf = box(1.6,ht-3,wLeaf,leafM); leaf.position.set(0,(ht-3)/2+1,-sgn*wLeaf/2); p.add(leaf);
      p.add(box(1,8,1.2,M(0x222222),1.2,ht*0.55,-sgn*(wLeaf-3)));
      g.add(p); pivots.push({p,sgn}); };
    if(k==='fridge') mk(wd/2-0.5,wd-1,1); else { mk(wd/2-0.5,wd/2-1,1); mk(-wd/2+0.5,wd/2-1,-1); }
    g.userData.setOpen = t=>{ for(const o of pivots) o.p.rotation.y = -o.sgn*t*1.95; };
  } else if(k==='dresser'){
    g.add(box(dp,ht,wd,wood,0,ht/2,0)); g.add(box(dp+2,2,wd+2,M(0x3a2a1c),0,ht+1,0));
    const drs = [];
    for(let i=0;i<3;i++){
      const dr = new THREE.Group(); dr.position.set(dp/2,5+i*8.5,0);
      dr.add(box(1.6,7.5,wd-3,M(wood.color.getHex()+0x151515),0.8,0,0));
      dr.add(box(7,5,wd-6,M(0x2a1f16),-3,-0.5,0));
      dr.add(box(1.2,1.5,8,M(0xbbbbbb),2,0,0));
      g.add(dr); drs.push(dr);
    }
    g.userData.setOpen = t=>{ drs.forEach((d,i)=>{ d.position.x = dp/2 + t*(7+i*1.5); }); };
  } else if(k==='bed'){
    g.add(box(dp,6,wd,M(0x4a3626),0,5,0), box(dp-2,7,wd-2,M(0xe8e4d8),0,11,0), box(dp-3,3,wd*0.62,M(0x9a2f35),0,15,wd*0.18),
          box(10,5,16,M(0xffffff),0,16,-wd/2+11), box(dp,16,3,M(0x4a3626),0,10,-wd/2));
  } else if(k==='sofa'){
    g.add(box(dp,10,wd,M(0x4b5d6e),0,7,0), box(8,16,wd,M(0x435464),-dp/2+4,15,0), box(dp,13,5,M(0x3c4b5a),0,13,-wd/2+2.5), box(dp,13,5,M(0x3c4b5a),0,13,wd/2-2.5));
  } else if(k==='table'){
    g.add(box(dp,3,wd,wood,0,ht,0));
    for(const sx of [-1,1]) for(const sz of [-1,1]) g.add(box(3,ht,3,wood,sx*(dp/2-3),ht/2,sz*(wd/2-3)));
    g.add(box(8,6,8,M(0xdddddd),0,ht+4.5,0));
  }
  g.position.set(f.x,2,f.y); g.rotation.y = -f.face;
  g.userData.setOpen = g.userData.setOpen || (()=>{});
  return g;
}

// ---------- 3D city ----------
function roadTexture(){
  const c = document.createElement('canvas'); c.width=64; c.height=128;
  const g = c.getContext('2d'); g.fillStyle='#34353a'; g.fillRect(0,0,64,128);
  g.fillStyle='rgba(255,255,255,.04)'; for(let i=0;i<120;i++) g.fillRect(Math.random()*64,Math.random()*128,2,2);
  g.fillStyle='#d8c24a'; g.fillRect(30,10,4,50); g.fillStyle='#bbb'; g.fillRect(2,0,2,128); g.fillRect(60,0,2,128);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const doorMat = M(0x5a3a22);
function buildCityMeshes(){
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(7000,7000), M(0x2a3a26));
  ground.rotation.x = -Math.PI/2; ground.position.y = -1; scene.add(ground);
  const len = HI-LO;
  for(let k=0;k<=GRID;k++) for(const vertical of [true,false]){
    const tex = roadTexture(); tex.repeat.set(1,len/256);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(ROAD,len), new THREE.MeshLambertMaterial({map:tex}));
    m.rotation.x = -Math.PI/2; if(!vertical) m.rotation.z = Math.PI/2;
    m.position.set(vertical?k*BLOCK:WORLD/2, vertical?0.05:0.1, vertical?WORLD/2:k*BLOCK);
    scene.add(m);
  }
  const pave = M(0x50534b);
  for(let i=0;i<GRID;i++) for(let j=0;j<GRID;j++) scene.add(box(BLOCK-ROAD,2,BLOCK-ROAD,pave,i*BLOCK+BLOCK/2,1,j*BLOCK+BLOCK/2));

  const floorM = M(0x8a7a62), lampM = new THREE.MeshBasicMaterial({color:0xffe9a0});
  const roofG = new THREE.ConeGeometry(1,1,4);
  const wallMats = {};
  for(const h of houses){
    scene.add(box(h.w,1.5,h.h,floorM,h.x+h.w/2,2,h.y+h.h/2));
    scene.add(box(46,0.4,34,M([0x7a2e2e,0x2e4a7a,0x3a6b3a][(h.x+h.y)%3]),h.x+h.w/2,2.9,h.y+h.h/2));
    h.roofMat = new THREE.MeshLambertMaterial({color:new THREE.Color(h.color).multiplyScalar(0.55),transparent:true});
    const roof = new THREE.Group();
    const cone = new THREE.Mesh(roofG,h.roofMat); cone.rotation.y = Math.PI/4;
    cone.scale.set((h.w/2+7)/0.7071,30,(h.h/2+7)/0.7071); cone.position.y = WALL_H+15;
    const slab = new THREE.Mesh(boxG,h.roofMat); slab.scale.set(h.w+10,3,h.h+10); slab.position.y = WALL_H+1.5;
    roof.add(cone,slab); roof.position.set(h.x+h.w/2,0,h.y+h.h/2); scene.add(roof); h.roof = roof;
  }
  for(const w of walls){
    if(w.noMesh) continue;
    wallMats[w.color] = wallMats[w.color] || M(w.color);
    scene.add(box(w.w,WALL_H,w.h,wallMats[w.color],w.x+w.w/2,WALL_H/2,w.y+w.h/2));
  }
  for(const d of doors){
    scene.add(box(DOOR_W,WALL_H-DOOR_H,WT,wallMats[d.house.color],d.cx,DOOR_H+(WALL_H-DOOR_H)/2,d.cy));
    const pivot = new THREE.Group(); pivot.position.set(d.x,0,d.cy);
    pivot.add(box(DOOR_W,DOOR_H,3,doorMat,DOOR_W/2,DOOR_H/2,0), box(3,3,6,M(0xcccc88),DOOR_W-6,24,0));
    scene.add(pivot); d.mesh = pivot;
  }
  for(const f of furniture){ f.group = buildFurnMesh(f); scene.add(f.group); }
  for(let i=0;i<=GRID;i++) for(let j=0;j<=GRID;j++){
    const x = i*BLOCK+ROAD/2-6, z = j*BLOCK+ROAD/2-6;
    scene.add(box(4,70,4,mat.metal,x,35,z), box(8,5,8,lampM,x,72,z));
  }
}

// =====================================================================
//  DAY / NIGHT CLOCK   (day = 2 min, night = 4 min)
// =====================================================================
const DAY_LEN = 120, NIGHT_LEN = 240, CYCLE = DAY_LEN+NIGHT_LEN, DUSK = 15;
const cyc = t=>t%CYCLE;
const dayNumber = t=>Math.floor(t/CYCLE)+1;
const zombieTime = t=>{ const c=cyc(t); return c>=DAY_LEN && c<CYCLE-DUSK; };        // zombies only roam at night
const daylight = t=>{ const c=cyc(t); if(c<DAY_LEN-DUSK) return 1; if(c<DAY_LEN) return 1-(c-(DAY_LEN-DUSK))/DUSK; if(c<CYCLE-DUSK) return 0; return (c-(CYCLE-DUSK))/DUSK; };

// =====================================================================
let state = 'cutscene';                  // cutscene | lobby | play | over
let players = [], slots = [null,null,null,null];       // slots[i] = {kind,pad} once joined
let zombies=[], bullets=[], loots=[], splats=[], particles=[], noiseRings=[];
let gtime=0, spawnT=0, lootT=0, lastPhase='day', shake=0;
const groundPlane = new THREE.Plane(new THREE.Vector3(0,1,0),0);
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), hitPt = new THREE.Vector3(), v3 = new THREE.Vector3();

function clearList(list){ for(const o of list) scene.remove(o.mesh); list.length = 0; }
function toast(P,text,col='#fff'){ P.toasts.push({text,col,t:4}); if(P.toasts.length>4) P.toasts.shift(); }
function toastAll(text,col){ for(const p of players) toast(p,text,col); }
const curGun = P=>{ const it = P.bag[P.eq]; return it&&it.type==='gun'?it:null; };
const firstGunIdx = P=>P.bag.findIndex(i=>i.type==='gun');
const itemName = it=> it.type==='gun'?WEAPONS[it.id].name : it.type==='med'?'Medkit' : it.type;

function refreshGear(P){
  const g = curGun(P);
  for(const h of [P.walker,P.bikeMesh.userData.rider]){
    const u = h.userData;
    u.gun.visible = !!g;
    if(g){ const w = WEAPONS[g.id]; u.gun.scale.set(w.len,3,3); u.gun.position.set(6+w.len/2,6,0); u.gunMat.color.setHex(w.color); }
    while(u.slung.children.length) u.slung.remove(u.slung.children[0]);
    let n = 0;
    P.bag.forEach((it,i)=>{ if(it.type==='gun'&&i!==P.eq&&n<3){
      const w = WEAPONS[it.id], gp = new THREE.Group(); gp.add(box(3,3,w.len+10,M(w.color)));
      gp.position.set(-8-n*1.7,10,0); gp.rotation.x = n%2?0.75:-0.75; u.slung.add(gp); n++; } });

// ---------- noise: zombies are drawn to it ----------
function makeNoise(x,y,r,src){
  noiseRings.push({x,y,r,t:0,life:1.1});
  for(const z of zombies) if(z.hp>0){
    const d = Math.hypot(z.x-x,z.y-y);
    if(d<r){ z.alert = {x:x+rand(-20,20),y:y+rand(-20,20),t:12}; }
  }
}

// ---------- start / reset ----------
function resetWorld(){
  for(const d of doors){ d.open=false; d.ang=0; if(d.wall) d.wall.off=false; }
  for(const f of furniture){ f.state='closed'; f.anim=0; f.busy=null; f.item = f.search? rollItem():null; if(f.floatMesh){ scene.remove(f.floatMesh); f.floatMesh=null; } }
  for(const idx of SPAWN_IDX){                      // each starting house always holds a pistol + ammo
    const s = houses[idx].furn.filter(f=>f.search);
    s[0].item = {type:'gun',id:'pistol'}; s[1].item = {type:'ammo',n:24};
  }
}
function viewports(n){
  if(n===1) return [{x:0,y:0,w:W,h:H}];
  if(n===2) return [{x:0,y:0,w:W/2,h:H},{x:W/2,y:0,w:W/2,h:H}];
  const w=W/2,h=H/2; return [{x:0,y:0,w:w,h:h},{x:w,y:0,w:w,h:h},{x:0,y:h,w:w,h:h},{x:w,y:h,w:w,h:h}];
}
function disposePlayers(){
  for(const p of players){ scene.remove(p.walker,p.bikeMesh,p.light); }
  players = [];
}
function startGame(){
  endCut(); stopDrone(); disposePlayers();
  clearList(zombies); clearList(bullets); clearList(loots); clearList(splats); clearList(particles); noiseRings.length=0;
  resetWorld();
  const act = []; slots.forEach((s,i)=>{ if(s) act.push(i); });
  const vps = viewports(act.length);
  act.forEach((slot,n)=>{
    const h = houses[SPAWN_IDX[slot]], col = PCOL[slot];
    const P = {id:slot, n, name:PNAME[slot], col, input:slots[slot], vp:vps[n],
      x:h.door.cx, y:h.y+h.h-WT-30, a:0, v:0, r:11, hp:100, ammo:0, cool:0, hurt:0, aim:Math.PI/2, mounted:false,
      bag:[], eq:-1, moving:false, steer:0, thr:false, kills:0, cash:0, alive:true, search:null, target:null,
      toasts:[], everMounted:false, stepT:0, noiseT:0, punchT:0, punchHit:false, lastFace:Math.PI/2, xhair:{x:0,y:0},
      bike:{x:h.door.cx,y:h.y+h.h+50,a:0}, home:h, roofA:houses.map(()=>1),
      camera:new THREE.PerspectiveCamera(55,1,1,4000), diedAt:0};
    P.walker = makeWalker(col); P.bikeMesh = makeBike(col);
    P.light = new THREE.PointLight(0xffe9b0,1.3,450,1.5);
    scene.add(P.walker,P.bikeMesh,P.light);
    P.camera.position.set(P.x,300,P.y+260);
    players.push(P); refreshGear(P);
    toast(P,'You wake up in a ruined house... search the cupboards (E) for a weapon.','#fc6');
    toast(P,'Daylight is for scavenging. Night is zombie time - and they hunt by NOISE.','#9cf');
  });
  gtime=0; spawnT=0; lootT=0; lastPhase='day'; shake=0;
  for(let i=0;i<30;i++) spawnLoot();
  applyLighting(1);
  cutLight.intensity = 0;
  state='play';
}

function inHouse(x,y,pad=0){ return houses.some(h=>x>h.x-pad&&x<h.x+h.w+pad&&y>h.y-pad&&y<h.y+h.h+pad); }
function rectHit(x,y,r,w){ return x+r>w.x&&x-r<w.x+w.w&&y+r>w.y&&y-r<w.y+w.h; }
function inWall(x,y,r){ return walls.some(w=>!w.off&&rectHit(x,y,r,w)); }
function spawnZombie(){
  const alive = players.filter(p=>p.alive); if(!alive.length) return;
  for(let t=0;t<30;t++){
    const A = pick(alive), ang = rand(0,TAU), d = rand(560,950);
    const x = A.x+Math.cos(ang)*d, y = A.y+Math.sin(ang)*d;
    if(x<LO||x>HI||y<LO||y>HI) continue;
    if(alive.some(p=>Math.hypot(p.x-x,p.y-y)<520)) continue;
    if(inWall(x,y,12)||inHouse(x,y,8)) continue;
    const mesh = makeZombie(); mesh.position.set(x,0,y); scene.add(mesh);
    const day = dayNumber(gtime);
    zombies.push({x,y,a:rand(0,TAU),hp:3+(day>1?1:0)+(day>3?1:0),r:12,spd:rand(45,85)+Math.min(day*6,40),
      cool:0,wob:rand(0,9),hit:0,gt:rand(1,6),alert:{x:A.x+rand(-60,60),y:A.y+rand(-60,60),t:10},burnAt:rand(0,12),mesh});
    return;
  }
}

// ---------- collision ----------
function pushOut(o){
  let hit=false;
  for(const w of walls){
    if(w.off) continue;
    const cx = clamp(o.x,w.x,w.x+w.w), cy = clamp(o.y,w.y,w.y+w.h);
    const dx = o.x-cx, dy = o.y-cy, d = Math.hypot(dx,dy);
    if(d < o.r){
      hit = true;
      if(d>0.001){ o.x += dx/d*(o.r-d); o.y += dy/d*(o.r-d); } else o.y -= o.r;
    }
  }
  const before=o.x+o.y;
  o.x = clamp(o.x,LO+o.r,HI-o.r); o.y = clamp(o.y,LO+o.r,HI-o.r);
  return hit || before!==o.x+o.y;
}

//  INTERACTION: doors, searching, bag, bike
// =====================================================================
function frontPoint(f){ return {x:f.x+Math.cos(f.face)*(f.dp/2+16), y:f.y+Math.sin(f.face)*(f.dp/2+16)}; }
function findTarget(P){
  let best=null, bd=1e9;
  for(const d of doors){ const dd=Math.hypot(d.cx-P.x,d.cy-P.y); if(dd<62&&dd<bd){ best={type:'door',d,x:d.cx,y:d.cy,h:44}; bd=dd; } }
  for(const f of furniture){
    if(!f.search) continue;
    if(f.state==='open'&&!f.item) continue;
    const fp = frontPoint(f), dd = Math.hypot(fp.x-P.x,fp.y-P.y);
    if(dd<46&&dd-14<bd){ best={type:'furn',f,x:f.x,y:f.y,h:f.ht+16}; bd=dd-14; }
  }
  const db = Math.hypot(P.bike.x-P.x,P.bike.y-P.y);
  if(db<52&&db<bd) best={type:'bike',x:P.bike.x,y:P.bike.y,h:34};
  return best;
}
function targetLabel(t){
  if(t.type==='door') return t.d.open?'[E] Close door':'[E] Open door';
  if(t.type==='bike') return '[E] Ride the bike';
  if(t.f.state==='closed') return '[E] Search '+t.f.name;
  return '[E] Take '+itemName(t.f.item);
}
function interact(P){
  if(P.search) return;
  if(P.mounted){
    if(Math.abs(P.v)>80){ toast(P,'Slow down to get off the bike','#f88'); sfx.deny(); return; }
    P.bike.x=P.x; P.bike.y=P.y; P.bike.a=P.a; P.mounted=false; P.r=11; P.v=0;
    for(const s of [1,-1]){ const nx=P.x+Math.cos(P.a+s*Math.PI/2)*26, ny=P.y+Math.sin(P.a+s*Math.PI/2)*26;
      if(!inWall(nx,ny,11)){ P.x=nx; P.y=ny; break; } }
    sfx.dismount(); return;
  }
  const t = P.target; if(!t) return;
  if(t.type==='bike'){
    P.mounted=true; P.r=14; P.x=P.bike.x; P.y=P.bike.y; P.a=P.bike.a; P.v=0; P.everMounted=true; sfx.mount();
    toast(P,'Move to ride. The engine is LOUD - zombies hear it. E to get off.','#fc6'); return;
  }
  if(t.type==='door'){
    const d = t.d;
    if(d.open){
      const blockers=[...players.filter(p=>p.alive),...zombies.filter(z=>z.hp>0)];
      if(blockers.some(o=>rectHit(o.x,o.y,o.r+4,d.wall))){ toast(P,'Something is in the way','#f88'); sfx.deny(); return; }
      d.open=false; d.wall.off=false; sfx.doorClose(); makeNoise(d.cx,d.cy,260);
    } else { d.open=true; d.wall.off=true; sfx.doorOpen(); makeNoise(d.cx,d.cy,220); }
    return;
  }
  const f = t.f;
  if(f.state==='closed'){
    if(f.busy!==null&&f.busy!==P.id){ toast(P,'Someone else is searching this','#f88'); return; }
    f.busy=P.id; P.search = {f,t:0,tick:0}; sfx.scrape();
  } else if(f.item){
    if(P.bag.length>=BAG){ toast(P,'Bag full! Drop a gun with G or use a medkit (F)','#f88'); sfx.deny(); return; }
    const it = f.item; f.item=null; scene.remove(f.floatMesh); f.floatMesh=null;
    P.bag.push(it); if(it.type==='gun'&&!curGun(P)) P.eq = P.bag.length-1;
    refreshGear(P); sfx.pickup(); toast(P,'Took '+itemName(it)+'  (bag '+P.bag.length+'/'+BAG+')','#9f9');
    if(it.type==='gun') toast(P,'Spare guns are carried on your back. Q switches guns.','#9cf');
  }
}
function finishSearch(P){
  const f = P.search.f; P.search=null; f.busy=null; f.state='open'; sfx.clunk();
  const it = f.item;
  if(!it){ toast(P,'Nothing but dust and cobwebs.','#aaa'); return; }
  if(it.type==='ammo'){ P.ammo+=it.n; f.item=null; sfx.ammo(); toast(P,'+'+it.n+' ammo','#fd4'); }
  else if(it.type==='cash'){ P.cash+=it.n; f.item=null; sfx.coin(); toast(P,'Found $'+it.n,'#6f6'); }
  else { f.floatMesh = makeItemIcon(it); scene.add(f.floatMesh); sfx.found(); toast(P,'Found a '+itemName(it)+'! Press E to take it.','#fd4'); }
}
function useMed(P,i){
  const it = P.bag[i]; if(!it||it.type!=='med') return false;
  if(P.hp>=100){ toast(P,'Health is already full','#aaa'); return true; }
  P.bag.splice(i,1); P.hp=Math.min(100,P.hp+40); sfx.med(); fixEq(P); refreshGear(P); toast(P,'+40 health','#6f6'); return true;
}
function fixEq(P){ if(!curGun(P)) P.eq = firstGunIdx(P); }
function cancelSearch(P){ if(P.search){ P.search.f.busy=null; P.search=null; } }

//  LOBBY
// =====================================================================
function joinDevice(kind,pad){
  if(slots.some(s=>s&&s.kind===kind&&(kind!=='pad'||s.pad===pad))) return;
  const i = slots.findIndex(s=>!s); if(i<0) return;
  slots[i] = {kind,pad}; sfx.pickup();
}
function leaveDevice(kind,pad){
  const i = slots.findIndex(s=>s&&s.kind===kind&&(kind!=='pad'||s.pad===pad)); if(i>=0){ slots[i]=null; sfx.deny(); }
}
const joinedCount = ()=>slots.filter(Boolean).length;
function lobbyLayout(){
  const cw = Math.min(250,(W-100)/4), gap=16, total=cw*4+gap*3, x0=(W-total)/2, y0=H*0.3, ch=Math.min(260,H*0.4);
  return {cw,gap,x0,y0,ch,start:{x:W/2-110,y:y0+ch+80,w:220,h:48}};
}
function lobbyClick(){
  const L = lobbyLayout(), s = L.start;
  if(joinedCount()>0 && mouse.x>s.x&&mouse.x<s.x+s.w&&mouse.y>s.y&&mouse.y<s.y+s.h){ startGame(); return; }
  joinDevice('kbm');
}
function pollLobbyPads(){
  const pads = navigator.getGamepads? navigator.getGamepads():[];
  for(const gp of pads){ if(!gp) continue;
    const prev = (pollLobbyPads.prev = pollLobbyPads.prev||{})[gp.index]||[];
    const b = i=>!!(gp.buttons[i]&&gp.buttons[i].pressed);
    if(b(0)&&!prev[0]) joinDevice('pad',gp.index);
    if(b(1)&&!prev[1]) leaveDevice('pad',gp.index);
    if(b(9)&&!prev[9]&&joinedCount()>0) startGame();
    pollLobbyPads.prev[gp.index] = Array.from(gp.buttons,x=>x.pressed);
  }
}
function onGlobalKey(code){
  if(state==='cutscene' && (code==='Enter'||code==='Space')) goLobby();
  else if(state==='lobby'){
    if(['KeyW','KeyA','KeyS','KeyD','Space'].includes(code)) joinDevice('kbm');
    else if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(code)) joinDevice('kb2');
    else if(code==='Escape'){ leaveDevice('kbm'); leaveDevice('kb2'); }
    else if(code==='Enter'&&joinedCount()>0) startGame();
  }
  else if(state==='over' && code==='KeyR') goLobby();
}

// =====================================================================
//  UPDATE
// =====================================================================
function updatePlayer(P,dt){
  const c = readCtl(P);
  P.hurt = Math.max(0,P.hurt-dt); P.cool-=dt; P.punchT=Math.max(0,P.punchT-dt);
  if(!P.alive) return;
  // --- bag / use keys ---
  if(c.use) interact(P);
  if(c.sw){ const gi=P.bag.map((it,i)=>it.type==='gun'?i:-1).filter(i=>i>=0);
    if(gi.length>1){ P.eq = gi[(gi.indexOf(P.eq)+1)%gi.length]; refreshGear(P); sfx.switchGun(); toast(P,'Equipped '+WEAPONS[curGun(P).id].name,'#9cf'); } }
  if(c.drop){ const g=curGun(P); if(g){ P.bag.splice(P.eq,1); fixEq(P); refreshGear(P); toast(P,'Dropped '+WEAPONS[g.id].name,'#f88'); sfx.clunk(); } }
  if(c.med){ const i=P.bag.findIndex(x=>x.type==='med'); if(i>=0) useMed(P,i); else toast(P,'No medkit in your bag','#aaa'); }
  if(c.slot>=0){ const it=P.bag[c.slot]; if(it){ if(it.type==='gun'){ P.eq=c.slot; refreshGear(P); sfx.switchGun(); } else useMed(P,c.slot); } }

  // --- movement ---
  P.thr = false;
  if(P.mounted){
    cancelSearch(P);
    if(c.up){ P.v += 340*dt; P.thr=true; } else if(c.dn) P.v -= 300*dt;
    else P.v -= Math.sign(P.v)*Math.min(Math.abs(P.v),140*dt);
    P.v = clamp(P.v,-110,330);
    P.steer = clamp(c.mx,-1,1);
    P.a += P.steer*2.6*dt*clamp(P.v/110,-1,1);
    P.x += Math.cos(P.a)*P.v*dt; P.y += Math.sin(P.a)*P.v*dt;
    if(pushOut(P)){ if(Math.abs(P.v)>140){ P.hp -= 3; shake=Math.max(shake,6); sfx.bump(); makeNoise(P.x,P.y,260); } P.v *= 0.5; }
    P.moving = Math.abs(P.v)>5;
    P.noiseT -= dt;                                       // the engine roars - zombies hear it
    if(P.noiseT<=0){ P.noiseT=0.6; makeNoise(P.x,P.y,130+Math.abs(P.v)*0.9); }
  } else {
    const l = Math.hypot(c.mx,c.my); P.moving = l>0.05 && !P.search;
    if(P.moving){ const k=Math.min(1,l)/l; P.x += c.mx*k*125*dt; P.y += c.my*k*125*dt; P.lastFace=Math.atan2(c.my,c.mx); }
    pushOut(P); P.v = 0;
    if(P.moving){ P.stepT+=dt; if(P.stepT>0.34){ P.stepT=0; sfx.step(); makeNoise(P.x,P.y,70); } } else P.stepT=0.2;
  }

  // --- searching (rummaging is noisy too) ---
  if(P.search){
    const fp = frontPoint(P.search.f);
    if(Math.hypot(fp.x-P.x,fp.y-P.y)>66 || P.moving){ cancelSearch(P); }
    else {
      P.search.t += dt; P.search.tick -= dt;
      if(P.search.tick<=0){ P.search.tick=0.15; sfx.rummage(); if(Math.random()<0.25) makeNoise(P.x,P.y,110); }
      if(P.search.t>=1.6) finishSearch(P);
    }
  }

  // --- aim ---
  if(P.input.kind==='kbm'){
    ndc.set((mouse.x-P.vp.x)/P.vp.w*2-1, -((mouse.y-P.vp.y)/P.vp.h)*2+1); ray.setFromCamera(ndc,P.camera);
    if(ray.ray.intersectPlane(groundPlane,hitPt)) P.aim = Math.atan2(hitPt.z-P.y, hitPt.x-P.x);
    P.xhair.x = mouse.x-P.vp.x; P.xhair.y = mouse.y-P.vp.y;
  } else {
    if(c.aim!==null) P.aim = c.aim;
    else {                                              // aim assist for keyboard-2 / pad without right stick
      let best=null,bd=420; for(const z of zombies) if(z.hp>0){ const d=Math.hypot(z.x-P.x,z.y-P.y); if(d<bd && Math.abs(normAng(Math.atan2(z.y-P.y,z.x-P.x)-P.lastFace))<0.9){ bd=d; best=z; } }
      P.aim = best? Math.atan2(best.y-P.y,best.x-P.x) : (P.mounted? P.a : P.lastFace);
    }
    v3.set(P.x+Math.cos(P.aim)*170,10,P.y+Math.sin(P.aim)*170).project(P.camera);
    P.xhair.x = (v3.x*.5+.5)*P.vp.w; P.xhair.y = (-v3.y*.5+.5)*P.vp.h;
  }

  // --- LEFT CLICK / fire: shoot the gun, or fight with fists ---
  const g = curGun(P), w = g&&WEAPONS[g.id];
  if(c.fire && !P.search && P.cool<=0){
    if(g && P.ammo>0){
      P.cool = w.cool; P.ammo--; sfx.shot(g.id); makeNoise(P.x,P.y,w.noise);
      for(let i=0;i<w.pellets;i++){
        const a = P.aim+rand(-w.spread,w.spread), inh = P.mounted?P.v*0.5:0;
        const mesh = new THREE.Mesh(bulletG,bulletM); scene.add(mesh);
        bullets.push({x:P.x+Math.cos(P.aim)*24,y:P.y+Math.sin(P.aim)*24,h:22,
          vx:Math.cos(a)*w.speed+Math.cos(P.a)*inh, vy:Math.sin(a)*w.speed+Math.sin(P.a)*inh, life:w.life, dmg:w.dmg, owner:P, mesh});
      }
      shake = Math.max(shake, g.id==='shotgun'?3:g.id==='rifle'?2:0.8);
    } else if(!P.mounted){                                // fists (also when out of ammo)
      P.cool = 0.5; P.punchT = 0.28; P.punchHit = false; sfx.whoosh(); makeNoise(P.x,P.y,90);
      if(g && P.ammo<=0 && !P.noAmmoTold){ P.noAmmoTold=true; toast(P,'Out of ammo - punching instead!','#fc3'); }
    } else if(g){ P.cool=0.4; sfx.empty(); }
  }
  if(P.ammo>0) P.noAmmoTold=false;
  if(P.punchT>0 && !P.punchHit && P.punchT<0.18){                  // the punch lands mid-swing
    P.punchHit = true;
    for(const z of zombies) if(z.hp>0){
      const d = Math.hypot(z.x-P.x,z.y-P.y);
      if(d<z.r+P.r+26 && Math.abs(normAng(Math.atan2(z.y-P.y,z.x-P.x)-P.aim))<1.1){
        z.hp -= 1; z.hit=0.25; blood(z.x,z.y,5); sfx.punch(1); shake=Math.max(shake,2);
        z.x += Math.cos(P.aim)*14; z.y += Math.sin(P.aim)*14; pushOut(z);
        makeNoise(z.x,z.y,100);
        if(z.hp<=0) killZombie(z,P);
      }
    }
  }
  // --- street loot ---
  for(const l of loots){
    if(Math.hypot(l.x-P.x,l.y-P.y)<l.r+P.r+6){
      l.taken=true;
      if(l.kind==='ammo'){ P.ammo+=15; sfx.ammo(); toast(P,'+15 ammo','#fd4'); }
      if(l.kind==='med'){ P.hp=Math.min(100,P.hp+25); sfx.med(); toast(P,'+25 health','#6f6'); }
      if(l.kind==='cash'){ P.cash+=50; sfx.coin(); }
    }
  }
  P.target = P.search? null : findTarget(P);
}

function updateGame(dt){
  gtime += dt; shake = Math.max(0,shake-dt*20);
  const day = dayNumber(gtime), night = zombieTime(gtime), d = daylight(gtime);
  applyLighting(d);
  // phase change announcements
  const phase = night? 'night' : (cyc(gtime)>=CYCLE-DUSK? 'dawn' : 'day');
  if(phase!==lastPhase){
    if(phase==='night'){ sfx.nightHorn(); toastAll('NIGHT '+day+' FALLS - zombies are coming. Stay quiet or fight!','#f66'); spawnT=0; }
    if(phase==='dawn'){ sfx.dawn(); toastAll('The sun rises. Zombies burn away...','#fd4'); }
    if(phase==='day' && lastPhase==='dawn'){ toastAll('DAY '+day+' - you survived! Scavenge while it is safe.','#6f6'); }
    lastPhase = phase;
  }

  for(const P of players) updatePlayer(P,dt);
  const alive = players.filter(p=>p.alive);

  // bullets
  for(const b of bullets){
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if(inWall(b.x,b.y,2)) b.life=0;
    for(const z of zombies) if(z.hp>0 && Math.hypot(z.x-b.x,z.y-b.y)<z.r+3){
      z.hp-=b.dmg; z.hit=0.15; b.life=0; blood(z.x,z.y,4); sfx.hit(falloff(z.x,z.y));
      z.x += b.vx*0.01; z.y += b.vy*0.01;
      if(z.hp<=0) killZombie(z,b.owner);
      break;
    }
  }
  bullets = bullets.filter(b=>{ if(b.life>0) return true; scene.remove(b.mesh); return false; });

  // zombies: chase what they SEE, hunt what they HEAR, wander otherwise
  let groanedNow = false;
  const dawnT = cyc(gtime)-(CYCLE-DUSK);
  for(const z of zombies){
    if(z.hp<=0){ z.dead -= dt; continue; }
    z.hit=Math.max(0,z.hit-dt); z.cool-=dt; z.wob+=dt*6;
    if(dawnT>=z.burnAt && dawnT>=0){                      // sunlight burns them away
      blood(z.x,z.y,6,smokeM); sfx.sizzle(falloff(z.x,z.y)); z.gone=true; continue;
    }
    let near=null, nd=1e9; for(const p of alive){ const dd=Math.hypot(p.x-z.x,p.y-z.y); if(dd<nd){ nd=dd; near=p; } }
    if(z.alert){ z.alert.t-=dt; if(z.alert.t<=0 || Math.hypot(z.alert.x-z.x,z.alert.y-z.y)<30) z.alert=null; }
    const sightR = 230;                                    // short eyesight at night
    let tx=null,ty=null,speed=z.spd*0.3;
    if(near && nd<sightR){ tx=near.x; ty=near.y; speed=z.spd; }
    else if(z.alert){ tx=z.alert.x; ty=z.alert.y; speed=z.spd*0.9; }
    if(tx!==null){ const t=Math.atan2(ty-z.y,tx-z.x); z.a += normAng(t-z.a)*Math.min(1,dt*6); }
    else if(Math.random()<dt*0.5) z.a += rand(-1,1);
    if(near && nd<650){ z.gt-=dt; if(z.gt<=0){ z.gt=rand(2.5,6); if(!groanedNow){ groanedNow=true; sfx.groan(falloff(z.x,z.y),rand(.85,1.15)); } } }
    const s = speed * (z.hit>0?0.2:1);
    z.x += Math.cos(z.a)*s*dt; z.y += Math.sin(z.a)*s*dt;
    pushOut(z);
    for(const o of zombies) if(o!==z && o.hp>0){
      const dx=z.x-o.x, dy=z.y-o.y, dd=Math.hypot(dx,dy);
      if(dd>0 && dd<z.r*1.6){ z.x+=dx/dd*30*dt; z.y+=dy/dd*30*dt; }
    }
    for(const p of alive){
      if(Math.hypot(p.x-z.x,p.y-z.y) < z.r+p.r){
        if(p.mounted && Math.abs(p.v) > 120){ z.hp -= 3; blood(z.x,z.y,8); p.v *= 0.85; shake=Math.max(shake,4); sfx.ram(); makeNoise(z.x,z.y,300);
          if(z.hp<=0) killZombie(z,p); }
        else if(z.cool<=0){ z.cool=0.8; p.hp -= 8; p.hurt=0.25; shake=Math.max(shake,5); sfx.bite(); sfx.hurt(); cancelSearch(p); }
      }
    }
    if(nd>1500 && !z.alert) z.gone=true;
  }
  zombies = zombies.filter(z=>{ if(z.gone || (z.hp<=0 && z.dead<=0)){ scene.remove(z.mesh); return false; } return true; });
  for(const r of noiseRings) r.t+=dt; noiseRings = noiseRings.filter(r=>r.t<r.life);

  loots = loots.filter(l=>{ l.bob+=dt*4; if(!l.taken) return true; scene.remove(l.mesh); return false; });

  // zombie spawning: ONLY at night, more every day
  spawnT -= dt;
  if(night && alive.length){
    const cap = Math.min(18+10*(day-1)+8*(alive.length-1),130);
    if(spawnT<=0 && zombies.filter(z=>z.hp>0).length<cap){ spawnZombie(); spawnT = Math.max(0.15,0.9-day*0.08); }
  }
  lootT -= dt;
  if(lootT<=0 && loots.length<44){ spawnLoot(); lootT=4; }

  for(const q of particles){ q.x+=q.vx*dt; q.y+=q.vy*dt; q.h+=q.vh*dt; q.vh-=300*dt; q.life-=dt; q.vx*=0.95; q.vy*=0.95; }
  particles = particles.filter(q=>{ if(q.life>0 && q.h>0) return true; scene.remove(q.mesh); return false; });

  for(const dr of doors){ const tgt=dr.open?1.75:0; dr.ang += (tgt-dr.ang)*Math.min(1,dt*6); }
  for(const f of furniture){ const tgt=f.busy!==null||f.state==='open'?1:0; f.anim += (tgt-f.anim)*Math.min(1,dt*(tgt?3.5:6)); }

  // deaths + game over (the game only ends when EVERY player is dead)
  for(const P of players) if(P.alive && P.hp<=0){
    P.alive=false; P.diedAt=gtime; cancelSearch(P); sfx.death();
    if(P.mounted){ P.bike.x=P.x; P.bike.y=P.y; P.bike.a=P.a; P.mounted=false; }
    toastAll(P.name+' was eaten!','#f66');
  }
  if(!players.some(p=>p.alive)){ state='over'; }
}

// ---------- sync meshes + cameras ----------
function syncScene(dt){
  for(const P of players){
    const ud = P.bikeMesh.userData, mounted = P.mounted;
    const bp = mounted? P : P.bike;
    P.bikeMesh.position.set(bp.x,0,bp.y); P.bikeMesh.rotation.y = -bp.a;
    ud.rider.visible = mounted;
    ud.lean.rotation.x = mounted ? -(P.steer||0)*0.28*clamp(P.v/200,-1,1) : 0.16;
    if(mounted){ ud.wf.rotation.z -= P.v*dt/9; ud.wb.rotation.z -= P.v*dt/9; }
    const gun = curGun(P), u = P.walker.userData;
    P.walker.visible = !mounted;
    P.walker.position.set(P.x,0,P.y);
    if(!P.alive){ u.body.rotation.z = -Math.PI/2; u.body.position.y = 5; }
    else if(!mounted){
      P.walker.rotation.y = -P.aim;
      const sw = P.moving? Math.sin(gtime*11)*0.7 : 0;
      u.legs[0].rotation.z = sw; u.legs[1].rotation.z = -sw;
      const armsUp = gun&&P.ammo>=0? Math.PI/2.2 : 0.15;
      u.upper.rotation.z = 0; u.upper.rotation.y = 0;
      u.arms[0].rotation.z = armsUp; u.arms[1].rotation.z = armsUp;
      if(P.search){
        const f = P.search.f; P.walker.rotation.y = -Math.atan2(f.y-P.y,f.x-P.x);
        u.arms[0].rotation.z = 1.1+Math.sin(gtime*15)*0.5; u.arms[1].rotation.z = 1.1+Math.cos(gtime*13)*0.5; u.upper.rotation.z = -0.4;
      } else if(P.punchT>0){                              // fist swing animation
        const k = 1-P.punchT/0.28, sw2 = Math.sin(k*Math.PI);
        u.arms[1].rotation.z = 0.15+sw2*1.5; u.arms[0].rotation.z = 0.15+sw2*0.6; u.upper.rotation.y = -sw2*0.5; u.upper.rotation.z = -sw2*0.2;
      }
    } else { ud.rider.userData.upper.rotation.y = normAng(-(P.aim - P.a)); }
    P.light.position.set(P.x+Math.cos(mounted?P.a:P.aim)*50,mounted?60:70,P.y+Math.sin(mounted?P.a:P.aim)*50);
    P.light.visible = P.alive;
    // roofs fade out for the player standing inside the house
    houses.forEach((h,i)=>{
      const inside = P.alive && P.x>h.x-4&&P.x<h.x+h.w+4&&P.y>h.y-4&&P.y<h.y+h.h+4 && !(P.x>h.door.x-4&&P.x<h.door.x+DOOR_W+4&&Math.abs(P.y-h.door.cy)<20&&!h.door.open);
      P.roofA[i] += ((inside?0:1)-P.roofA[i])*Math.min(1,dt*6);
    });
    // camera (dead players spectate a living teammate)
    const F = P.alive? P : (players.find(p=>p.alive)||P);
    const hgt = F.mounted?330:270, off = F.mounted?300:235;
    const sx = shake? rand(-shake,shake):0, sy = shake? rand(-shake,shake):0;
    P.camera.position.lerp(v3.set(F.x+sx, hgt+sy, F.y+off), Math.min(1,dt*8));
    P.camera.lookAt(F.x,10,F.y-20);
  }
  for(const z of zombies){
    const m = z.mesh, u = m.userData;
    m.position.set(z.x,0,z.y); m.rotation.y = -z.a;
    if(z.hp>0){
      const sw = Math.sin(z.wob)*0.7;
      u.legs[0].rotation.z = sw; u.legs[1].rotation.z = -sw;
      u.arms[0].rotation.z = Math.PI/2.1 + Math.sin(z.wob*0.7)*0.15; u.arms[1].rotation.z = Math.PI/2.1 - Math.sin(z.wob*0.7)*0.15;
      u.head.rotation.z = Math.sin(z.wob*0.5)*0.15;
      m.scale.setScalar(1.25*(1+z.hit*1.2));
    }
  }
  for(const l of loots){ l.mesh.userData.item.position.y = 9+Math.sin(l.bob)*2.5; l.mesh.userData.item.rotation.y += dt*2; }
  for(const b of bullets) b.mesh.position.set(b.x,b.h,b.y);
  for(const q of particles) q.mesh.position.set(q.x,q.h,q.y);
  for(const d of doors) d.mesh.rotation.y = d.ang*d.sign;
  for(const f of furniture){
    if(f.anim>0.001||f.group.userData.lastAnim){ f.group.userData.setOpen(f.anim); f.group.userData.lastAnim = f.anim>0.001; }
    f.group.position.y = f.busy!==null ? 2+Math.sin(gtime*40)*0.25 : 2;
    if(f.floatMesh){ f.floatMesh.position.set(f.x,f.ht+22+Math.sin(gtime*3)*3,f.y); f.floatMesh.rotation.y += dt*2; }
  }
}

function renderPlayers(){
  R.setScissorTest(true);
  for(const P of players){
    const vp = P.vp;
    houses.forEach((h,i)=>{ h.roofMat.opacity = P.roofA[i]; h.roof.visible = P.roofA[i]>0.03; });
    R.setViewport(vp.x,H-vp.y-vp.h,vp.w,vp.h); R.setScissor(vp.x,H-vp.y-vp.h,vp.w,vp.h);
    P.camera.aspect = vp.w/vp.h; P.camera.updateProjectionMatrix();
    R.render(scene,P.camera);
  }
  R.setScissorTest(false); R.setViewport(0,0,W,H);
  houses.forEach(h=>{ h.roofMat.opacity=1; h.roof.visible=true; });
}

//  HUD (2D overlay, one per viewport)

function toScreen(P,x,y,z){ v3.set(x,y,z).project(P.camera); return {x:(v3.x*.5+.5)*VW,y:(-v3.y*.5+.5)*VH}; }
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function hex(c){ return '#'+c.toString(16).padStart(6,'0'); }

function drawClock(){
  const c = cyc(gtime), night = c>=DAY_LEN, day = dayNumber(gtime);
  const left = night? CYCLE-c : DAY_LEN-c;
  ctx.textAlign='center';
  ctx.fillStyle='rgba(0,0,0,.55)'; roundRect(VW/2-110,6,220,40,8); ctx.fill();
  ctx.fillStyle = night?'#9bb0ff':'#ffd75a'; ctx.font='bold 17px monospace';
  ctx.fillText((night?'☾ NIGHT ':'☀ DAY ')+day,VW/2,24);
  ctx.fillStyle='#ccc'; ctx.font='12px monospace'; ctx.fillText((night?'dawn in ':'night in ')+fmtTime(left)+'   survived '+(day-1)+' day'+(day===2?'':'s'),VW/2,40);
}
function drawHUD(P){
  const small = VW<700, g = curGun(P);
  ctx.font='bold 15px monospace'; ctx.textAlign='left';
  ctx.fillStyle='rgba(0,0,0,.55)'; ctx.fillRect(8,8,small?196:240,92);
  ctx.fillStyle=hex(P.col); ctx.fillRect(8,8,5,92);
  ctx.fillStyle='#333'; ctx.fillRect(20,18,small?170:200,13);
  ctx.fillStyle=P.hp>35?'#3c3':'#e33'; ctx.fillRect(20,18,(small?1.7:2)*Math.max(0,P.hp),13);
  ctx.fillStyle='#fff';
  ctx.fillText(P.name+'  HP '+Math.ceil(Math.max(0,P.hp)),20,48);
  ctx.fillText((g?WEAPONS[g.id].name.toUpperCase():'FISTS')+'  AMMO '+P.ammo,20,66);
  ctx.fillText('KILLS '+P.kills+'  $'+P.cash,20,86);
  drawClock();
  // minimap with noise rings
  const m=small?100:130, s=m/(HI-LO), mx=VW-m-8, my=8;
  ctx.fillStyle='rgba(0,0,0,.6)'; ctx.fillRect(mx,my,m,m);
  ctx.save(); ctx.beginPath(); ctx.rect(mx,my,m,m); ctx.clip();
  for(const r of noiseRings){ ctx.strokeStyle=`rgba(255,120,60,${1-r.t/r.life})`; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(mx+(r.x-LO)*s,my+(r.y-LO)*s,Math.max(1,r.r*s*(r.t/r.life)),0,TAU); ctx.stroke(); }
  ctx.fillStyle='#e22'; for(const z of zombies) if(z.hp>0) ctx.fillRect(mx+(z.x-LO)*s,my+(z.y-LO)*s,2,2);
  ctx.fillStyle='#5f5'; for(const l of loots) ctx.fillRect(mx+(l.x-LO)*s,my+(l.y-LO)*s,2,2);
  ctx.fillStyle='#fc3'; ctx.fillRect(mx+(P.bike.x-LO)*s-2,my+(P.bike.y-LO)*s-2,4,4);
  for(const q of players){ ctx.fillStyle=q.alive?hex(q.col):'#555'; ctx.fillRect(mx+(q.x-LO)*s-2,my+(q.y-LO)*s-2,5,5); }
  ctx.restore();
  if(!small){ ctx.fillStyle='#bbb'; ctx.font='10px monospace'; ctx.textAlign='center'; ctx.fillText('orange rings = noise',mx+m/2,my+m+11); }

  if(!P.alive){
    const F = players.find(p=>p.alive);
    ctx.fillStyle='rgba(120,0,0,.35)'; ctx.fillRect(0,0,VW,VH);
    ctx.fillStyle='#fff'; ctx.font='bold 26px monospace'; ctx.textAlign='center'; ctx.fillText('YOU DIED',VW/2,VH/2-10);
    ctx.font='15px monospace'; ctx.fillText(F?'Spectating '+F.name+' ...':'',VW/2,VH/2+18);
    return;
  }
  // objective
  let obj='';
  if(!P.bag.some(i=>i.type==='gun')) obj='Search furniture for a weapon (walk up + E) - or punch with left click';
  else if(!P.everMounted) obj='Your bike is parked outside your front door (E)';
  if(obj){ ctx.textAlign='center'; const fs=small?10:13; ctx.font='bold '+fs+'px monospace'; const txt=small?obj:'OBJECTIVE: '+obj, ow=Math.min(VW-16,ctx.measureText(txt).width+20);
    ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(VW/2-ow/2,small?108:52,ow,22); ctx.fillStyle='#fc6'; ctx.fillText(txt,VW/2,small?123:69); }
  // prompt
  if(P.target&&!P.search){
    const sp = toScreen(P,P.target.x,P.target.h,P.target.y), t = targetLabel(P.target);
    ctx.font='bold 14px monospace'; ctx.textAlign='center';
    const tw = ctx.measureText(t).width+20;
    ctx.fillStyle='rgba(0,0,0,.7)'; roundRect(sp.x-tw/2,sp.y-30,tw,26,6); ctx.fill();
    ctx.fillStyle='#ffe27a'; ctx.fillText(t,sp.x,sp.y-12);
  }
  if(P.mounted && Math.abs(P.v)<80){ ctx.textAlign='center'; ctx.fillStyle='#bbb'; ctx.font='12px monospace'; ctx.fillText('[E] get off the bike',VW/2,VH-112); }
  if(P.search){
    const sp = toScreen(P,P.search.f.x,P.search.f.ht+16,P.search.f.y), k = P.search.t/1.6;
    ctx.lineWidth=6; ctx.strokeStyle='rgba(0,0,0,.6)'; ctx.beginPath(); ctx.arc(sp.x,sp.y,22,0,TAU); ctx.stroke();
    ctx.strokeStyle='#ffe27a'; ctx.beginPath(); ctx.arc(sp.x,sp.y,22,-Math.PI/2,-Math.PI/2+TAU*k); ctx.stroke();
    ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.font='bold 13px monospace'; ctx.fillText('Searching'+'.'.repeat(1+Math.floor(gtime*3)%3),sp.x,sp.y+44);
  }
  // bag
  const sw=small?44:56, gap=5, bx=VW/2-(BAG*(sw+gap)-gap)/2, by=VH-sw-26;
  ctx.textAlign='center';
  for(let i=0;i<BAG;i++){
    const x = bx+i*(sw+gap), it = P.bag[i], eq = i===P.eq;
    ctx.fillStyle = eq?'rgba(255,200,60,.35)':'rgba(0,0,0,.6)'; roundRect(x,by,sw,sw,6); ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle = eq?'#ffd24a':'#666'; ctx.stroke();
    ctx.fillStyle='#888'; ctx.font='10px monospace'; ctx.fillText(String(i+1),x+8,by+12);
    if(it){
      ctx.fillStyle = it.type==='gun'? '#e8e8e8':'#ff6b6b'; ctx.font='bold 14px monospace';
      ctx.fillText(it.type==='gun'?WEAPONS[it.id].tag:'MED',x+sw/2,by+sw/2+5);
      ctx.font='9px monospace'; ctx.fillStyle='#aaa'; ctx.fillText(it.type==='gun'?(eq?'in hand':'on back'):'heal',x+sw/2,by+sw-6);
    }
  }
  ctx.fillStyle='#999'; ctx.font='11px monospace'; ctx.fillText('BAG '+P.bag.length+'/'+BAG,VW/2,VH-8);
  // toasts
  ctx.font='bold 14px monospace';
  for(const t of P.toasts) t.t-=1/60;
  P.toasts = P.toasts.filter(t=>t.t>0);
  P.toasts.forEach((t,i)=>{ ctx.globalAlpha=clamp(t.t,0,1); ctx.fillStyle=t.col; ctx.fillText(t.text,VW/2,by-14-(P.toasts.length-1-i)*20); ctx.globalAlpha=1; });
  if(P.hurt>0){ ctx.fillStyle=`rgba(200,0,0,${P.hurt*1.2})`; ctx.fillRect(0,0,VW,VH); }
  if(P.hp<35){ const a=0.15+0.1*Math.sin(gtime*7); const gr=ctx.createRadialGradient(VW/2,VH/2,VH*0.35,VW/2,VH/2,VH*0.85); gr.addColorStop(0,'rgba(120,0,0,0)'); gr.addColorStop(1,`rgba(160,0,0,${a*3})`); ctx.fillStyle=gr; ctx.fillRect(0,0,VW,VH); }
  // crosshair (fist reach ring when you have no ammo / no gun)
  const cx=P.xhair.x, cy=P.xhair.y;
  ctx.strokeStyle=hex(P.col); ctx.lineWidth=2; ctx.beginPath(); ctx.arc(cx,cy,9,0,TAU);
  ctx.moveTo(cx-14,cy); ctx.lineTo(cx-5,cy); ctx.moveTo(cx+14,cy); ctx.lineTo(cx+5,cy); ctx.moveTo(cx,cy-14); ctx.lineTo(cx,cy-5); ctx.moveTo(cx,cy+14); ctx.lineTo(cx,cy+5); ctx.stroke();
}
function drawAllHUD(){
  for(const P of players){
    ctx.save(); ctx.beginPath(); ctx.rect(P.vp.x,P.vp.y,P.vp.w,P.vp.h); ctx.clip(); ctx.translate(P.vp.x,P.vp.y);
    VW=P.vp.w; VH=P.vp.h; drawHUD(P); ctx.restore();

    if(players.length>2){ ctx.moveTo(0,H/2); ctx.lineTo(W,H/2); } ctx.stroke();
  }
}

function drawOver(){

  ctx.fillStyle='#fd4'; ctx.font='bold 28px monospace'; ctx.fillText('You reached DAY '+day+'  -  survived '+days+' full day'+(days===1?'':'s')+' ('+fmtTime(gtime)+')',W/2,H*0.25+50);
  ctx.font='20px monospace';
  players.forEach((P,i)=>{ ctx.fillStyle=hex(P.col); ctx.fillText(P.name+'   kills '+P.kills+'   cash $'+P.cash+'   lasted '+fmtTime(P.diedAt),W/2,H*0.25+110+i*34); });
  ctx.fillStyle='#ddd'; ctx.font='20px monospace'; ctx.fillText('Press R to return to the lobby',W/2,H*0.25+110+players.length*34+40);
}

// =====================================================================
//  3D CUTSCENE: a man is eaten
// =====================================================================
const CUT_LEN = 12;
let cutT = 0, cut = null;
function startCut(){
  cutT = 0;
  const man = makeHuman({pants:mat.jeans, shirt:mat.shirt, skin:mat.skin}); man.scale.setScalar(1.25); scene.add(man);
  const zs = [];
  for(let i=0;i<7;i++){ const z = makeZombie(); scene.add(z); zs.push(z); }
  const pool = new THREE.Mesh(splatG,splatM); pool.rotation.x=-Math.PI/2; pool.position.y=2.7; pool.visible=false; scene.add(pool);
  cut = {man,zs,pool,mx0:1100,mz:1200,step:0,did:{},sq:0};
  mainCam.position.set(1000,60,1300);
  applyLighting(0); cutLight.intensity = 1.3;
}
function endCut(){
  if(!cut) return;
  scene.remove(cut.man, cut.pool); cut.zs.forEach(z=>scene.remove(z)); cut = null; cutLight.intensity = 0;
}
function updateCut(dt){
  cutT += dt; const T = cutT, c = cut;
  const walk = Math.min(T,3.2), mx = c.mx0+walk*28, mz = c.mz;
  const mu = c.man.userData, fall = T>3.4 ? Math.min((T-3.4)*2.5,1) : 0;
  c.man.position.set(mx,0,mz);
  if(fall===0){
    const s = Math.sin(T*7)*0.6; mu.legs[0].rotation.z = s; mu.legs[1].rotation.z = -s;
    mu.arms[0].rotation.z = -s*0.7; mu.arms[1].rotation.z = s*0.7;
    if(T>2.4){ mu.upper.rotation.y = Math.sin(T*8)*0.5; mu.arms.forEach(a=>a.rotation.z = Math.PI*0.85+Math.sin(T*18)*0.4); }
  } else {
    mu.body.rotation.z = fall*Math.PI/2; mu.body.position.y = fall*6;
    mu.legs.forEach((l,i)=>l.rotation.z = Math.sin(T*12+i*2)*0.5*(T<6.5?1:0.1));
    mu.arms.forEach((a,i)=>a.rotation.z = Math.PI*0.8+Math.sin(T*16+i)*0.5*(T<6.5?1:0.1));
  }
  const p = clamp((T-0.4)/2.8,0,1), e = p*p*(3-2*p);
  c.zs.forEach((z,i)=>{
    const side = i%2?1:-1, sx = mx+side*(450+i*55), sz = mz+(i-3)*28;
    const ang = 0.4+i*(TAU/7), fx = mx+Math.cos(ang)*28, fz = mz+Math.sin(ang)*22;
    const x = sx+(fx-sx)*e, zz = sz+(fz-sz)*e;
    z.position.set(x,0,zz); z.rotation.y = -Math.atan2(mz-zz, mx-x);
    const u = z.userData;
    if(p<1){ const s = Math.sin(T*6+i)*0.7; u.legs[0].rotation.z = s; u.legs[1].rotation.z = -s; }
    else { u.body.rotation.z = -0.7 + Math.sin(T*9+i*1.7)*0.18; u.legs.forEach(l=>l.rotation.z = 0.5); u.arms.forEach(a=>a.rotation.z = Math.PI/2.3); }
  });
  c.pool.visible = T>3.6;
  if(c.pool.visible){ const r = Math.min((T-3.6)*12,55); c.pool.scale.set(r,r*0.8,1); c.pool.position.set(mx+8,2.7,mz); }
  if(T>3.8 && T<8 && Math.random()<0.5) blood(mx+rand(-12,12),mz+rand(-12,12),2);
  for(const q of particles){ q.x+=q.vx*dt; q.y+=q.vy*dt; q.h+=q.vh*dt; q.vh-=300*dt; q.life-=dt; q.vx*=0.95; q.vy*=0.95; }
  particles = particles.filter(q=>{ if(q.life>0 && q.h>0) return true; scene.remove(q.mesh); return false; });

  if(AC){
    if(!drone) startDrone();
    if(T<3.2){ c.step-=dt; if(c.step<=0){ c.step=0.42; sfx.step(1.6); } }
    if(T>2.4&&!c.did.gasp){ c.did.gasp=1; sfx.gasp(); }
    if(T>3.0&&T<3.4&&!c.did.gr){ c.did.gr=1; sfx.groan(0.9,1); sfx.groan(0.8,.85); }
    if(T>3.4&&!c.did.scream){ c.did.scream=1; sfx.scream(); sfx.bite(); }
    if(T>3.8&&T<8.5){ c.sq-=dt; if(c.sq<=0){ c.sq=rand(.18,.4); sfx.squelch(); if(Math.random()<.2) sfx.groan(.5,rand(.8,1)); } }
    if(T>7.5&&!c.did.hb){ c.did.hb=1; sfx.heartbeat(); }
  }

  const k = clamp(T/8,0,1), r = 320-k*190, th = 0.9+T*0.16, h = 70-k*28;
  const shk = (T>3.4&&T<6.5)? 2.5:0;
  mainCam.position.set(mx+Math.sin(th)*r+rand(-shk,shk), h+rand(-shk,shk), mz+Math.cos(th)*r);
  mainCam.lookAt(mx,16,mz);
  cutLight.position.set(mx-20,90,mz+30);
  cutLight.color.setHex(0xffd89a); cutLight.intensity = T>3?(0.8+Math.random()*0.5):1.4;

  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,70); ctx.fillRect(0,H-90,W,90);
  ctx.textAlign='center'; ctx.fillStyle='#ddd'; ctx.font='20px monospace';
  let cap='';
  if(T<2.6) cap='Day 47 of the outbreak. The city went quiet...';
  else if(T<3.4) cap='He thought he was alone.';
  else if(T>=7&&T<9.5) cap='Nobody is coming to save you.';
  else if(T>=9.5) cap='Wake up. Find a weapon. Survive the nights.';
  ctx.fillText(cap,W/2,H-45);
  if(T>3.4&&T<6){ ctx.fillStyle='#e22'; ctx.font='bold 44px monospace'; ctx.fillText('AAAAAHHH!!!',W/2+Math.sin(T*25)*4,H*0.3); }
  ctx.fillStyle='#777'; ctx.font='14px monospace'; ctx.textAlign='right'; ctx.fillText('ENTER / SPACE to skip',W-16,H-12);
  if(!AC){ ctx.textAlign='left'; ctx.fillStyle='#fc6'; ctx.fillText('Click anywhere to enable sound',16,H-12); }
  if(T>CUT_LEN-1){ ctx.fillStyle=`rgba(0,0,0,${clamp(T-(CUT_LEN-1),0,1)})`; ctx.fillRect(0,0,W,H); }
  if(T>CUT_LEN) goLobby();
}
function goLobby(){
  endCut(); stopDrone(); clearList(particles); clearList(zombies); clearList(bullets); clearList(loots); clearList(splats); noiseRings.length=0;
  disposePlayers(); applyLighting(0); state='lobby'; shake=0;
}

// ---------- boot ----------
buildCityData(); buildCityMeshes();
startCut();

let last = performance.now();
function loop(now){
  const dt = Math.min(0.05,(now-last)/1000); last = now;
  ctx.clearRect(0,0,W,H);
  if(state==='cutscene'){ updateCut(dt); R.render(scene,mainCam); }
  else if(state==='lobby'){ pollLobbyPads(); drawLobby(); }
  else if(state==='play'){ updateGame(dt); syncScene(dt); renderPlayers(); drawAllHUD(); }
  else if(state==='over'){ syncScene(dt); renderPlayers(); drawAllHUD(); drawOver(); }
  audioTick(dt);
  for(const k in keyHit) keyHit[k]=false;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
